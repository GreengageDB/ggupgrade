name: CI

on:
  pull_request:

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
      - run: |
          sudo apt-get update;
          sudo apt-get install -y protobuf-compiler;
          make install-dependencies
          make generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
# These tests can run without a cluster.
  unit_and_integration:
    name: Unit and Integration tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
      - run: |
          sudo apt-get update;
          sudo apt-get install -y protobuf-compiler;
          make install-dependencies
          make generate
      - run: make unit
      - run: |
          export GOPATH=$(go env GOPATH)
          make
          make install
          make integration
# These tests require a demo cluster
  demo_tests:
    name: "Single-node tests (${{ matrix.test }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        test: [acceptance, pg-upgrade-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: 'recursive'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/new/Dockerfile
          load: true
          push: false
          tags: ggdb7_ggupgrade:latest

      - name: Run test
        env:
          IMAGE: ggdb7_ggupgrade:latest
        run: |
          docker run --rm -v "$(pwd)/logs:/logs" "$IMAGE" bash ggupgrade/ci/new/run_test_in_demo_cluster.bash make ${{ matrix.test }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ggupgrade_${{ matrix.test }}_demo_logs
          path: ./logs/*
# These tests require a distributed cluster
  dist_tests:
    name: "Multi-node tests (${{ matrix.test }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: acceptance
            command: "go test --cover -count=1 -timeout 30m -v -run '^TestRevert$' ./test/acceptance/ggupgrade"
          - test: e2e_copy
            command: ci/new/e2e.bash copy
            needs_sqldump: true
          - test: e2e_link
            command: ci/new/e2e.bash link
            needs_sqldump: true
          - test: e2e_link_primaries_only
            command: ci/new/e2e.bash link
            with_mirrors: 'false'
            with_standby: 'false'
            needs_sqldump: true
          - test: e2e_link_no_standby
            command: ci/new/e2e.bash link
            with_mirrors: 'true'
            with_standby: 'false'
            needs_sqldump: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: 'recursive'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Fetch SQL Dump
        if: ${{ matrix.needs_sqldump }}
        id: sql-dump
        # TODO: Replace with reusing sql-dump/fetch action from greengage repo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="sqldump_ggdb6_ubuntu24.04"
          archive_name="ubuntu24.04_postgres_sqldump.tar"
          run_ids=$(gh run list -R greengagedb/greengage --workflow "Greengage SQL Dump" \
            --limit 100 \
            --json conclusion,status,databaseId \
            --jq 'map(select(.status=="completed" and .conclusion=="success")) | .[].databaseId')

          for run_id in $run_ids; do
            if gh run download "$run_id" -R greengagedb/greengage --name "$artifact_name" 2>/dev/null; then
              echo "::notice::SQL Dump $artifact_name found at $run_id finished workflow"
              break
            fi
          done

          if sql_dump=$(tar -xvf "$archive_name" 2>/dev/null); then
            rm -f "$archive_name"
            echo "sql_dump=$sql_dump" >> "$GITHUB_OUTPUT"
            echo "::notice::SQL Dump '$sql_dump' successfully unpacked. Archive $archive_name removed"
          else
            echo "::error::Artifact '$artifact_name' not found in any completed workflow run"
            exit 1
          fi

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/new/Dockerfile
          load: true
          push: false
          tags: ggdb7_ggupgrade:latest

      - name: Setup cluster
        env:
          IMAGE: ggdb7_ggupgrade:latest
        run: |
          bash ./ci/new/setup_dist_cluster.bash

      - name: Run test
        env:
          IMAGE: ggdb7_ggupgrade:latest
        run: |
          docker compose -p ggupgrade -f ./ci/new/docker-compose.yaml exec \
                 -u gpadmin -T coordinator env \
                 WITH_MIRRORS=${{ matrix.with_mirrors || 'true'}} \
                 WITH_STANDBY=${{ matrix.with_standby || 'true'}} \
                 SQLDUMP_PATH=${{ matrix.needs_sqldump && '/home/gpadmin/sqldump/dump.sql' || '' }} \
                 CLEANUP_SCRIPT=/home/gpadmin/gpdb_src/src/bin/pg_upgrade/cleanup_regression_dump_from_6X.sql \
                 ggupgrade/ci/new/run_test_in_dist_cluster.bash ${{ matrix.command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ggupgrade_${{ matrix.test }}_dist_logs
          path: ./logs_*
