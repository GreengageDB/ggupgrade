name: CI

on:
  pull_request:

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
      - run: |
          sudo apt-get update;
          sudo apt-get install -y protobuf-compiler;
          make install-dependencies
          make generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
# These tests can run without a cluster.
  unit_and_integration:
    name: Unit and Integration tests
    runs-on: ubuntu-22.04
    env:
      GOPATH: ${{ github.workspace }}/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
      - run: |
          echo "$GOPATH/bin" >> $GITHUB_PATH
          mkdir -p "$GOPATH/bin"
      - run: |
          sudo apt-get update;
          sudo apt-get install -y protobuf-compiler;
          make install-dependencies
          make generate
      - run: make unit
      - run: |
          make
          make install
          make integration
# These tests require a demo cluster
  demo_tests:
    name: "Single-node tests (${{ matrix.test }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        test: [acceptance, pg-upgrade-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: 'recursive'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/new/Dockerfile
          load: true
          push: false
          tags: gpdb7_ggupgrade:latest

      - name: Run test
        env:
          IMAGE: gpdb7_ggupgrade:latest
        run: |
          docker run --rm -v "$(pwd)/logs:/logs" "$IMAGE" bash ggupgrade/ci/new/run_test_in_demo_cluster.bash make ${{ matrix.test }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ggupgrade_${{ matrix.test }}_demo_logs
          path: ./logs/*
# These tests require a distributed cluster
  dist_tests:
    name: "Multi-node tests (${{ matrix.test }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: acceptance
            command: "go test --cover -count=1 -timeout 30m -v -run '^TestRevert$' ./test/acceptance/ggupgrade"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: 'recursive'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/new/Dockerfile
          load: true
          push: false
          tags: gpdb7_ggupgrade:latest

      - name: Setup cluster
        env:
          IMAGE: gpdb7_ggupgrade:latest
        run: |
          bash ./ci/new/setup_dist_cluster.bash

      - name: Run test
        env:
          IMAGE: gpdb7_ggupgrade:latest
        run: |
          docker compose -p ggupgrade -f ./ci/new/docker-compose.yaml exec \
                 -u gpadmin -T coordinator env \
                 WITH_MIRRORS=${{ matrix.with_mirrors || 'true'}} \
                 WITH_STANDBY=${{ matrix.with_standby || 'true'}} \
                 ggupgrade/ci/new/run_test_in_dist_cluster.bash ${{ matrix.command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ggupgrade_${{ matrix.test }}_dist_logs
          path: ./logs_*
