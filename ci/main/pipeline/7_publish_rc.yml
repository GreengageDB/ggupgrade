- name: publish-release-candidate
  plan:
    - in_parallel:
        - get: ggupgrade_src
          trigger: true
          passed:
            - build
            - unit-and-integration-tests
            {{- range .AcceptanceJobs}}
            - {{ .Name }}
            {{- end}}
            {{- range .PgupgradeJobs}}
            - {{.Name}}
            {{- end}}
            {{- range .UpgradeJobs}}
            - {{ .Name }}
            {{- end}}
            {{- range .MultihostAcceptanceJobs}}
            - {{ .Name }}
            {{- end}}
        - get: enterprise_rpm
          passed:
            - build
            {{- range .UpgradeJobs}}
            - {{ .Name }}
            {{- end}}
            {{- range .PgupgradeJobs}}
            - {{.Name}}
            {{- end}}
            {{- range .MultihostAcceptanceJobs}}
            - {{ .Name }}
            {{- end}}
        - get: oss_rpm
          passed:
            - build
    - task: add-semver
      config:
        platform: linux
        image_resource:
          type: registry-image
          source:
            repository: golang
            tag: 1.16
        inputs:
          - name: ggupgrade_src
          - name: oss_rpm
          - name: enterprise_rpm
        outputs:
          - name: renamed_oss_rpm
          - name: renamed_enterprise_rpm
        run:
          path: ggupgrade_src/ci/main/scripts/add-semver.bash
    - in_parallel:
        - put: oss_rc_rpm
          params:
            file: renamed_oss_rpm/ggupgrade-*.rpm
        - put: enterprise_rc_rpm
          params:
            file: renamed_enterprise_rpm/ggupgrade-*.rpm
  on_failure:
    do:
      - <<: *slack_alert
